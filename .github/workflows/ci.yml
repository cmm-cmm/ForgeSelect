name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-compatibility:
    name: Node ${{ matrix.node }} compatibility
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20.19", "24"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Typecheck workspaces (React/Vue wrappers)
        run: npm run typecheck --workspaces --if-present

      - name: Test workspaces with coverage (React/Vue wrappers)
        run: npm run test:coverage --workspaces --if-present

      - name: Build workspaces (React/Vue wrappers)
        run: npm run build --workspaces --if-present

      - name: Assemble site
        run: node scripts/build-site.mjs

      - name: Validate generated site
        run: node scripts/check-site.mjs

      # The build steps above already produced dist/ and both workspace builds,
      # so this runs the checks themselves rather than `check:package`, which
      # would repeat those builds. The checks live in one script either way —
      # inlining the pack commands here is what let this job drift out of step
      # with `check:package` and skip the peer-range guard entirely.
      - name: Validate npm package contents
        run: npm run check:package:built

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  # Split out of `test` so the three browser engines and the benchmark run
  # alongside lint/typecheck/coverage rather than after them. Both jobs must
  # pass, so nothing is skipped; the wall clock is now the longer of the two
  # instead of their sum. It repeats `npm ci` and the build because a job is a
  # fresh runner — cheap next to installing three browsers.
  browser:
    name: Browser tests and budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Both the e2e suite and the benchmark load the built bundle.
      - name: Build
        run: npm run build

      - name: Get installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'

      - name: Install Playwright OS dependencies only
        run: npx playwright install-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'

      - name: Browser tests
        run: npx playwright test

      - name: Performance and bundle budgets
        run: node scripts/benchmark.mjs
